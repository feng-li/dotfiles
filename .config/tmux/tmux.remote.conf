set -g status-position top
set -g status-bg colour208
set -g status-fg white
set -g allow-passthrough on

# Keep drag/copy gestures identical on headless SSH hosts. OSC 52 sends copied
# text to the connecting terminal; no remote DISPLAY, xclip or wl-paste needed.
set -s set-clipboard on
bind-key -n MouseDown3Pane if-shell -F -t = '#{&&:#{mouse_any_flag},#{m/r:^(ssh|mosh|mosh-client)$,#{pane_current_command}}}' 'select-pane -t = ; send-keys -M' 'select-pane -t = ; paste-buffer -p -r'
bind-key -T copy-mode MouseDown3Pane send-keys -X cancel \; paste-buffer -p -r
bind-key -T copy-mode-vi MouseDown3Pane send-keys -X cancel \; paste-buffer -p -r

# Keep every remote pane a different color, including inactive and full-screen panes.
set -g window-style 'bg=#2e003e'
set -g window-active-style 'bg=#2e003e'
